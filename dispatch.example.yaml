# Merged Cairn dispatcher configuration (M3).
#
# One worker implementation runs per task. In local mode the control plane spawns
# `cairn worker --task <file>` on this host. In container mode it keeps one
# long-lived container per project and runs `docker exec ... worker --task <file>`
# for each task. Both modes communicate only through task.json, result.json and
# the session directory under <workspace>/.cairn/sessions/<task-id>/.
#
# Projects without an authorized scope are never dispatched, and the worker's
# Host Bridge re-checks every tool call against the same scope (fail closed).
#
#   bun run cairn serve --config dispatch.yaml
#
# This file contains no credentials. Model/credential configuration lives in
# ~/.cairnweave/config (auth.json); never commit secrets here.

# Kept for compatibility with Cairn's config; the in-process scheduler does not
# call this HTTP endpoint.
server: "http://127.0.0.1:8000"

runtime:
  # "local" or "container" (the schema default is "container").
  execution: local
  # Scheduler tick interval in seconds.
  interval: 3
  # Global cap on concurrently running tasks.
  max_workers: 3
  # Projects that may be scheduled at once.
  max_running_projects: 2
  # Per-project cap. Above 1, concurrent tasks share the project workspace and are
  # coordinated by task-scoped artifact namespaces and an Observer review lease.
  max_project_workers: 1
  # Timeout for the startup model/credential probe.
  healthcheck_timeout: 15
  # Retained for config compatibility; only one worker implementation exists.
  worker_healthcheck: disabled
  # Prompt set under apps/cairn/src/prompts/.
  prompt_group: "default"
  # M36: write agent-context.yaml next to graph.yaml and point reason/explore at it.
  # "off" restores the pre-M36 prompt and files exactly.
  strategy_context: on

tasks:
  bootstrap:
    # Initial direct solve attempt.
    timeout: 300
    # Budget to summarize confirmed findings when the main phase is unusable.
    conclude_timeout: 90
  reason:
    timeout: 300
    # Hard cap on new intents created by one reason step.
    max_intents: 2
  explore:
    timeout: 600
    conclude_timeout: 120
  # Opt-in graph slicing for explore (and explore conclude) tasks. Reason and bootstrap
  # always receive the full graph. Open intents and the focus intent's sources are never
  # dropped; the caps only limit provenance/recent context.
  graph_slice:
    enabled: false
    max_facts: 80
    max_intents: 60
  # Reject evidence files smaller than this many bytes. Empty files are usually
  # placeholders, so the default is 1; set 0 to accept empty evidence.
  evidence:
    min_bytes: 1

worker:
  # Fraction of the hard deadline written as softDeadlineSeconds in task.json.
  # The control plane logs the soft deadline; a real Solver session also receives
  # one wrap-up steer. Failures still fall back to a separate conclude task.
  soft_deadline_ratio: 0.8
  # Keep graph.yaml/task.json/result.json/audit.jsonl/logs after a task for audit.
  retain_task_files: true
  # How long to wait for result.json after the worker exits.
  result_grace_seconds: 15
  # Give each task its own artifacts/<task-id>/ namespace. Defaults to true when
  # runtime.max_project_workers > 1; set false to opt out.
  scoped_artifacts: true

local:
  # Project workspaces live under <workspace_root>/<project_id>/. Omit to use the
  # directory cairn serve was started from.
  # workspace_root: "C:/cairn-runs"
  # "remove" deletes a project workspace when the project is no longer active;
  # "keep" is the safe default for audit.
  completed_action: keep

# Optional housekeeping (M6). Sweeps run once at startup (before the first dispatch)
# and then every sweep_interval_seconds. Running tasks and queued concludes are never
# removed. Both session rules default to 0 (keep everything).
retention:
  # Delete finished session directories older than this. 0 disables the age rule.
  session_max_age_days: 0
  # Keep at most this many session directories per project (oldest removed first).
  # Protected directories still count toward this limit. 0 disables the count rule.
  session_keep_per_project: 0
  # Seconds between background sweeps; 0 disables periodic sweeps (startup still runs).
  sweep_interval_seconds: 3600
  # Re-scan <workspace>/artifacts during every sweep. Existing paths keep the task id
  # that first indexed them.
  refresh_artifacts: false

# Optional live audit stream (M9). Disabled by default. When enabled, the scheduler
# mints a per-task bearer token and injects CAIRN_AUDIT_STREAM_URL/TOKEN into the
# worker; the Host Bridge still writes audit.jsonl first, then forwards each entry to the
# control plane so the ledger is updated while the task runs. The finish-time import stays
# authoritative and fills any missing suffix. Tokens never enter task.json or prompts.
# In container mode the token value is passed through the docker CLI's own environment
# (`-e CAIRN_AUDIT_STREAM_TOKEN`), not as a value in host argv.
#
# If the sender stops, the worker writes audit-stream-lost.json. Finish imports it into
# the audit_stream_lost sidecar and `GET /projects/{id}/audit/{task_id}/stream-lost`
# exposes it; the finish-time audit.jsonl import is still the recovery path.
#
#   local execution: omit url to use the actual bound loopback address.
#   container execution: url is required and must be reachable from the container
#   (for example http://host.docker.internal:8000 on Docker Desktop).
# audit_stream:
#   enabled: true
#   url: "http://127.0.0.1:8000"

# Observer sidecar (M4c). It maintains a project-level ideas/memory board and runs a
# separate review model; the main solver only gets read-only board tools. The solver
# answer is never changed by Observer failures, and flush is bounded by
# timeout_seconds. It is on by default (M22); set enabled: false to opt out.
# observer:
#   enabled: true
#   model: null                 # model-prefs.json entry; null reuses the main model
#   every_rounds: 4
#   window_rounds: 8
#   timeout_seconds: 60
#   max_reviews_per_task: 8
#   kernel_tasks: ["explore"]

# Optional Observer graph proposals (M11). On by default since M23 (dry_run); only
# effective when observer.enabled is also true and the task kind matches
# observer.kernel_tasks.
# The sidecar gets propose_graph_change, which writes candidate fact/intent/hint files
# under <session>/observer/proposals/. The control plane alone validates, dedupes and
# applies them; no new write route is exposed and the main solver cannot write that
# directory with its structured file tools.
#   mode: off      -> no candidate directory, no ingestion, no review
#   mode: dry_run  -> run every check, record `dry_run`, never write the graph
#   mode: apply    -> apply accepted proposals through the normal graph commands
# proposal ids are derived from project + task + filename, so rescanning a retained
# session is idempotent.
# proposals:
#   enabled: true
#   mode: dry_run
#   max_per_task: 20
#   max_file_bytes: 16384
#   max_total_bytes: 65536
#   allow_kinds: [fact, intent, hint]
#   require_evidence_for_fact: true
#   min_confidence: 0

# Optional slow-layer trigger policy (M12a). It decides when the scheduler starts a
# reason task; it does not change the graph or worker contract. Successful (including
# noop) reason turns persist fact/hint/open-intent watermarks in strategist_state, so a
# restart does not re-run reason for an unchanged graph. Failed turns apply a backoff
# without advancing those watermarks. `initial` and "all open intents finished" are
# urgent: they skip cooldown and the hourly cap, but never the failure backoff or
# waiting for running explore/conclude tasks. Set a threshold to 0 to disable it.
# strategist:
#   min_new_facts: 1              # 0 disables the fact-delta trigger
#   min_new_hints: 1              # 0 disables the hint-delta trigger
#   cooldown_seconds: 30          # minimum gap for non-urgent triggers; 0 disables
#   failure_backoff_seconds: 120  # block every trigger after a reason failure
#   max_runs_per_hour: 12         # rolling-hour cap for non-urgent triggers
#   zero_output_threshold: 3      # consecutive fact-less explore/conclude runs
#   stale_intent_seconds: 0       # all open intents stale for this long; 0 disables
#   fallback_interval_seconds: 0  # idle fallback since the last success; 0 disables
#   resource_pressure_ratio: 0.0  # reason when finished token/cost usage reaches this
#                                 # fraction of a budget limit (0..1); 0 disables

# Optional per-project budget policy (M12b). This is a default for every project, not a
# shared global pool. Token and cost limits are checked against finished runs only: tasks
# still in flight have not reported usage yet, so a project can overshoot by their usage.
# A pending conclude always runs, so a held intent can be salvaged or released.
# Worker usage comes from the main solver session's usage.json sidecar and excludes
# subagent sessions; treat these limits as cost guardrails, not as billing.
# budget:
#   max_project_tokens: 0       # stop new reason/explore/bootstrap at this total; 0 off
#   max_project_cost_usd: 0     # provider-reported USD total; 0 off
#   max_project_tasks: 0        # per-project concurrency; 0 inherits max_project_workers

# Optional worker profiles and stats-driven selection (M15a/M15e). A profile maps a stable
# id to an entry in the agent's model-prefs.json. In "prompt" mode (default) the task keeps
# the prompt frontmatter model and runs are not tagged. In "stats" mode the scheduler
# samples every profile in config order until each has min_runs finished runs, then picks
# the highest success rate, breaking ties by fewer tokens per finished run, lower cost,
# then config order. After sampling, an epsilon-greedy schedule may explore instead: the
# cumulative budget sum(epsilon * epsilon_decay^k) over eligible dispatches grows by one
# whole unit -> the least-sampled profile gets the task. epsilon: 0 disables exploration;
# epsilon_min > 0 keeps a permanent floor. All decisions derive from run history, so they
# are reproducible. A queued conclude reuses the failed task's profile while it is still
# configured. The chosen id and model go into task.json and runs.worker_profile/model.
# worker_profiles:
#   - id: fast
#     model: gateway/deepseek-flash
#   - id: deep
#     model: gateway/deepseek-pro
# worker_selection:
#   mode: prompt                # prompt | stats
#   min_runs: 3
#   epsilon: 0.1                # 0 disables exploration
#   epsilon_decay: 0.99         # (0,1]; 1 keeps epsilon constant
#   epsilon_min: 0.01           # floor; must not exceed epsilon

# Completion verification (M14a). The policy is chosen per project at creation time
# (`verification.kind`: challenge | evidence | off). `evidence_enforcement` supplies the
# default for API-created projects and for legacy projects without a stored policy;
# `completion` requires evidence before a project may close, `off` is the escape hatch
# for old projects and offline tests. The two challenge values below are environment
# variable NAMES, never tokens or URLs. The oracle stores flag counts only; flag values
# and the Agent-Token must never appear in this file, task.json, result.json or logs.
# verification:
#   evidence_enforcement: completion   # completion | off
#   flag_review: manual                # manual | off (default manual; also a runtime switch in the settings dialog)
#   challenge:
#     base_url_env: TCH_CHALLENGE_API_BASE_URL
#     agent_token_env: TCH_CHALLENGE_AGENT_TOKEN
#     timeout_ms: 5000

# Environment variables passed to every worker process. They are not written
# into task.json. Prefer ~/.cairnweave/config/auth.json for model credentials;
# do not put secrets in this file.
# Selects the real solver; omit or set "fake" for deterministic/offline runs.
# common_env:
#   CAIRN_SOLVER: "breachweave"
#   # Local mode only. Container mode sets CAIRN_AGENT_CONFIG_DIR itself and
#   # mounts the config read-only at /cairn/agent-config.
#   CAIRN_AGENT_CONFIG_DIR: "C:/Users/me/.cairnweave/config"
#   https_proxy: "http://127.0.0.1:7897"

# Container mode. One container per project; the project workspace is
# bind-mounted at /cairn/workspace and the agent config read-only at
# /cairn/agent-config. The Docker socket is never mounted into the container.
#
# runtime:
#   execution: container
# container:
#   image: "cairn-worker:latest"   # build: docker build -f Dockerfile.worker -t cairn-worker .
#   # Pick the least connectivity the lab needs; the Host Bridge still checks
#   # every tool call against the project scope. "none" is offline-only.
#   network_mode: "bridge"
#   # "remove" deletes the container when the project is no longer active.
#   completed_action: "remove"
#   cap_add: []
#   # Host directory that contains project workspaces. This is a control-plane
#   # path, not a container path. Defaults to local.workspace_root, then cwd.
#   workspace_root: "C:/cairn-runs"
#   # Optional override; this is the default and should match the image layout.
#   worker_argv: ["bun", "/app/apps/cairn/src/cli.ts", "worker", "--task"]
