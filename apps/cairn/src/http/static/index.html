        document.body.removeChild(textarea);
      }
    },

    highlightYaml(text) {
      const lines = String(text ?? '').split('\n');
      let currentSection = '';
      let activeItemIndent = null;
      let activeItemStripe = 0;
      let nextItemStripe = 0;

      return lines.map((line) => {
        const topLevelMatch = line.match(/^([A-Za-z_][A-Za-z0-9_-]*):\s*$/);
        if (topLevelMatch) {
          currentSection = topLevelMatch[1];
          activeItemIndent = null;
          activeItemStripe = 0;
          nextItemStripe = 0;
        }

        const tint = this.yamlSectionTint(currentSection);
        const indent = (line.match(/^(\s*)/) || ['',''])[1].length;
        const isBlank = /^\s*$/.test(line);
        const isListItem = /^(\s*)-\s+/.test(line);
        const isTopLevelItem = isListItem && indent === 0;

        if (isTopLevelItem) {
          activeItemIndent = indent;
          activeItemStripe = nextItemStripe;
          nextItemStripe = nextItemStripe === 0 ? 1 : 0;
        } else if (!isBlank && activeItemIndent !== null && indent === 0) {
          activeItemIndent = null;
        }

        const isNestedListItem = isListItem && activeItemIndent !== null && indent > activeItemIndent;
        const isItemContinuation = !isListItem && !isBlank && activeItemIndent !== null && indent > activeItemIndent;
        const isBlankWithinItem = isBlank && activeItemIndent !== null;
        const isItemLine = isTopLevelItem || isNestedListItem || isItemContinuation || isBlankWithinItem;
        const lineHtml = isBlank ? '&nbsp;' : this.highlightYamlLine(line);
        let background = currentSection ? tint.body : 'transparent';
        let fontWeight = '400';

        if (topLevelMatch) {
          background = tint.header;
          fontWeight = '700';
        } else if (isItemLine) {
          background = activeItemStripe === 0 ? tint.itemA : tint.itemB;
        }

        return `<div style="white-space:pre;padding:0 16px;background:${background};font-weight:${fontWeight};color:#0f172a">${lineHtml}</div>`;
      }).join('');
    },

    highlightTimeline(text) {
      const lines = String(text ?? '').split('\n');
      const stripes = ['#fffbf5', '#fef5ee'];
      let blockIndex = -1;
      return lines.map((line) => {
        if (/^\[/.test(line)) blockIndex++;
        const bg = blockIndex < 0 ? stripes[0] : stripes[blockIndex % 2];
        const isBlank = /^\s*$/.test(line);
        return `<div style="white-space:pre;padding:0 16px;background:${bg};color:#0f172a">${isBlank ? '&nbsp;' : this.escapeHtml(line)}</div>`;
      }).join('');
    },

    projectLabel(projectId, projectTitle) {
      return projectTitle ? `${projectId} - ${projectTitle}` : projectId;
    },

    deleteConfirmLabel() {
      return this.projectLabel(this.deleteConfirm.id, this.deleteConfirm.title);
    },

    requestDeleteProject(projectId, projectTitle = '') {
      if (!projectId) return;
      this.deleteConfirm = { id: projectId, title: projectTitle };
      this.showDeleteModal = true;
    },

    closeDeleteModal(force = false) {
      if (this.isDeletingProject && !force) return;
      this.showDeleteModal = false;
      this.deleteConfirm = { id: '', title: '' };
    },

    async viewProjectYaml(projectId, projectTitle = '') {
      if (!projectId) return;
      this.exportProjectId = projectId;
      this.yamlPreviewTitle = this.projectLabel(projectId, projectTitle);
      this.exportTab = 'yaml';
      await this.loadExportTab('yaml');
      this.showYamlModal = true;
    },

    async switchExportTab(tab) {
      if (tab === this.exportTab) return;
      this.exportTab = tab;
      await this.loadExportTab(tab);
    },

    async loadExportTab(tab) {
      if (!this.exportProjectId) return;
      try {
        const text = await this.fetchText(`/projects/${this.exportProjectId}/export?format=${tab}`);
        this.yamlPreviewText = text;
        this.yamlPreviewHtml = tab === 'yaml' ? this.highlightYaml(text) : this.highlightTimeline(text);
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    deleteProject() {
      if (!this.selectedProjectId) return;
      this.requestDeleteProject(this.selectedProjectId, this.project?.project?.title || '');
    },

    deleteProjectById(projectId, projectTitle = '') {
      this.requestDeleteProject(projectId, projectTitle);
    },

    async confirmDeleteProject() {
      const projectId = this.deleteConfirm.id;
      if (!projectId || this.isDeletingProject) return;
      try {
        this.isDeletingProject = true;
        await this.api('DELETE', `/projects/${projectId}`);
        this.closeDeleteModal(true);
        if (this.selectedProjectId === projectId && this.view === 'graph') {
          this.backToList();
        } else {
          await this.loadProjects();
        }
        this.showToast(`已删除 ${projectId}`);
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.isDeletingProject = false;
        if (!this.showDeleteModal) this.deleteConfirm = { id: '', title: '' };
      }
    },

    async loadSettings() {
      try {
        const s = await this.api('GET', '/settings');
        this.settingsForm.intent_timeout = s.intent_timeout;
        this.settingsForm.reason_timeout = s.reason_timeout;
      } catch(e) { console.error(e); }
    },

    async loadProject(id) {
      try { this.project = await this.api('GET', `/projects/${id}`); } catch(e) { this.showToast(e.message, 'error'); }
    },

    resetOpsPanels() {
      this.runsPanel = { items: [], loading: false, error: '', loadedFor: '' };
      this.strategistPanel = { data: null, loading: false, error: '', loadedFor: '' };
      this.auditPanel = {
        summaries: [],
        loading: false,
        error: '',
        loadedFor: '',
        selectedTaskId: '',
        detail: null,
        detailLoading: false,
        detailError: '',
        loss: null,
        lossLoading: false,
        lossError: '',
        lossLoaded: false,
      };
      this.evidencePanel = { factId: '', meta: null, files: [], loading: false, error: '', loadedFor: '' };
      this.proposalsPanel = { items: [], loading: false, error: '', loadedFor: '' };
      this.costPanel = { data: null, loading: false, error: '', loadedFor: '' };
    },

    selectSideTab(tab) {
      if (!['detail', 'hints', 'log', 'runs', 'strategist', 'audit', 'evidence', 'proposals', 'cost'].includes(tab)) return;
      this.sideTab = tab;
      this.loadActiveOpsTab();
    },

    loadActiveOpsTab() {
      if (this.sideTab === 'runs') this.loadRuns();
      else if (this.sideTab === 'strategist') this.loadStrategist();
      else if (this.sideTab === 'audit') this.loadAudit();
      else if (this.sideTab === 'evidence') this.loadEvidence();
      else if (this.sideTab === 'proposals') this.loadProposals();
      else if (this.sideTab === 'cost') this.loadCost();
    },

    async loadRuns() {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.runsPanel.loading = true;
      this.runsPanel.error = '';
      try {
        const runs = await this.api('GET', `/projects/${encodeURIComponent(projectId)}/runs`);
        if (this.selectedProjectId !== projectId) return;
        this.runsPanel.items = Array.isArray(runs) ? [...runs].reverse() : [];
        this.runsPanel.loadedFor = projectId;
      } catch (e) {
        if (this.selectedProjectId === projectId) this.runsPanel.error = this.errorText(e);
      } finally {
        if (this.selectedProjectId === projectId) this.runsPanel.loading = false;
      }
    },

    async loadStrategist() {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.strategistPanel.loading = true;
      this.strategistPanel.error = '';
      try {
        const data = await this.api('GET', `/projects/${encodeURIComponent(projectId)}/strategist?limit=20`);
        if (this.selectedProjectId !== projectId) return;
        this.strategistPanel.data = data && typeof data === 'object' ? data : null;
        this.strategistPanel.loadedFor = projectId;
      } catch (e) {
        if (this.selectedProjectId === projectId) this.strategistPanel.error = this.errorText(e);
      } finally {
        if (this.selectedProjectId === projectId) this.strategistPanel.loading = false;
      }
    },

    async requestStrategistReplan() {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.strategistPanel.replanLoading = true;
      try {
        const reason = (this.strategistPanel.replanReason || '').trim();
        await this.api('POST', `/projects/${encodeURIComponent(projectId)}/replan`, {
          requested_by: 'ui',
          ...(reason ? { reason } : {}),
        });
        this.strategistPanel.replanReason = '';
        this.showToast('已请求重规划');
        await this.loadStrategist();
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.strategistPanel.replanLoading = false;
      }
    },

    async loadProposals() {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.proposalsPanel.loading = true;
      this.proposalsPanel.error = '';
      try {
        const rows = await this.api('GET', `/projects/${encodeURIComponent(projectId)}/proposals`);
        if (this.selectedProjectId !== projectId) return;
        this.proposalsPanel.items = Array.isArray(rows) ? [...rows].reverse() : [];
        this.proposalsPanel.loadedFor = projectId;
      } catch (e) {
        if (this.selectedProjectId === projectId) this.proposalsPanel.error = this.errorText(e);
      } finally {
        if (this.selectedProjectId === projectId) this.proposalsPanel.loading = false;
      }
    },

    async loadCost() {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.costPanel.loading = true;
      this.costPanel.error = '';
      try {
        const data = await this.api('GET', `/projects/${encodeURIComponent(projectId)}/cost`);
        if (this.selectedProjectId !== projectId) return;
        this.costPanel.data = data && typeof data === 'object' ? data : null;
        this.costPanel.loadedFor = projectId;
      } catch (e) {
        if (this.selectedProjectId === projectId) this.costPanel.error = this.errorText(e);
      } finally {
        if (this.selectedProjectId === projectId) this.costPanel.loading = false;
      }
    },

    async loadAudit(preferredTaskId = null) {
      const projectId = this.selectedProjectId;
      if (!projectId) return;
      this.auditPanel.loading = true;
      this.auditPanel.error = '';
      try {
        const rows = await this.api('GET', `/projects/${encodeURIComponent(projectId)}/audit`);
        if (this.selectedProjectId !== projectId) return;
        const summaries = Array.isArray(rows) ? [...rows] : [];
        summaries.sort((a, b) =>
          String(b.last_at || '').localeCompare(String(a.last_at || '')) ||
          String(a.task_id).localeCompare(String(b.task_id))
        );
        this.auditPanel.summaries = summaries;
        this.auditPanel.loadedFor = projectId;
        const selected = preferredTaskId || this.auditPanel.selectedTaskId || summaries[0]?.task_id || '';
        this.auditPanel.selectedTaskId = selected;
        if (selected) await this.loadAuditTask(selected);
        else this.clearAuditTask();
      } catch (e) {
        if (this.selectedProjectId === projectId) this.auditPanel.error = this.errorText(e);
      } finally {
        if (this.selectedProjectId === projectId) this.auditPanel.loading = false;
      }
    },

    clearAuditTask() {
      this.auditPanel.detail = null;
      this.auditPanel.detailLoading = false;
      this.auditPanel.detailError = '';
      this.auditPanel.loss = null;
      this.auditPanel.lossLoading = false;
      this.auditPanel.lossError = '';
      this.auditPanel.lossLoaded = false;
    },

    async loadAuditTask(taskId) {
      const projectId = this.selectedProjectId;
      if (!projectId || !taskId) {
        this.clearAuditTask();
        return;
      }
      this.auditPanel.detail = null;
      this.auditPanel.detailLoading = true;
      this.auditPanel.detailError = '';
      this.auditPanel.loss = null;
      this.auditPanel.lossLoading = true;
      this.auditPanel.lossError = '';
      this.auditPanel.lossLoaded = false;

      const encodedProject = encodeURIComponent(projectId);
      const encodedTask = encodeURIComponent(taskId);
      const [detailResult, lossResult] = await Promise.allSettled([
        this.api('GET', `/projects/${encodedProject}/audit/${encodedTask}`),
        this.api('GET', `/projects/${encodedProject}/audit/${encodedTask}/stream-lost`),
      ]);

      if (this.selectedProjectId !== projectId || this.auditPanel.selectedTaskId !== taskId) return;

      if (detailResult.status === 'fulfilled') {
        this.auditPanel.detail = detailResult.value;
      } else {
        this.auditPanel.detailError = this.errorText(detailResult.reason);
      }

      if (lossResult.status === 'fulfilled') {
        this.auditPanel.loss = lossResult.value?.stream_lost ?? null;
        this.auditPanel.lossLoaded = true;
      } else {
        this.auditPanel.lossError = this.errorText(lossResult.reason);
      }

      this.auditPanel.detailLoading = false;
      this.auditPanel.lossLoading = false;
    },

    async openAuditForTask(taskId) {
      if (!taskId) return;
      this.sideTab = 'audit';
      this.auditPanel.selectedTaskId = taskId;
      // Do not show the previously selected task's chain if the summary fetch fails.
      this.clearAuditTask();
      await this.loadAudit(taskId);
    },

    auditTaskChoices() {
      const selected = this.auditPanel.selectedTaskId;
      const choices = this.auditPanel.summaries.slice();
      if (selected && !choices.some(task => task.task_id === selected)) {
        const detail = this.auditPanel.detail;
        choices.unshift({
          task_id: selected,
          event_count: detail?.task_id === selected ? detail.event_count : null,
          root_hash: detail?.root_hash ?? null,
          first_at: null,
          last_at: null,
        });
      }
      return choices;
    },

    auditTaskChoiceLabel(task) {
      const count = task?.event_count;
      if (count === null || count === undefined) return `${task.task_id} · 无账本事件`;
      return `${task.task_id} · ${count} 个事件`;
    },

    async loadEvidence() {
      if (!this.project) return;
      const projectId = this.selectedProjectId;
      const facts = Array.isArray(this.project.facts) ? this.project.facts : [];
      let factId = this.evidencePanel.factId;
      if (!facts.some(fact => fact.id === factId)) {
        const selected = (this.selectedFacts || []).find(id => facts.some(fact => fact.id === id));
        factId = selected
          || (facts.some(fact => fact.id === 'goal') ? 'goal' : '')
          || facts[0]?.id
          || '';
      }
      this.evidencePanel.factId = factId;
      if (!projectId || !factId) return;
      await this.loadEvidenceFact(factId);
    },

    async loadEvidenceFact(factId) {
      const projectId = this.selectedProjectId;
      if (!projectId || !factId) {
        this.evidencePanel.meta = null;
        this.evidencePanel.files = [];
        return;
      }
      this.evidencePanel.factId = factId;
      this.evidencePanel.meta = null;
      this.evidencePanel.files = [];
      this.evidencePanel.loading = true;
      this.evidencePanel.error = '';
      const encodedProject = encodeURIComponent(projectId);
      const encodedFact = encodeURIComponent(factId);
      try {
        const [meta, files] = await Promise.all([
          this.api('GET', `/projects/${encodedProject}/facts/${encodedFact}/meta`),
          this.api('GET', `/projects/${encodedProject}/facts/${encodedFact}/evidence`),
        ]);
        if (this.selectedProjectId !== projectId || this.evidencePanel.factId !== factId) return;
        this.evidencePanel.meta = meta;
        this.evidencePanel.files = Array.isArray(files) ? files : [];
        this.evidencePanel.loadedFor = `${projectId}:${factId}`;
      } catch (e) {
        if (this.selectedProjectId === projectId && this.evidencePanel.factId === factId) {
          this.evidencePanel.error = this.errorText(e);
        }
      } finally {
        if (this.selectedProjectId === projectId && this.evidencePanel.factId === factId) {
          this.evidencePanel.loading = false;
        }
      }
    },

    async openEvidenceForFact(factId) {
      if (!factId) return;
      this.sideTab = 'evidence';
      this.evidencePanel.factId = factId;
      await this.loadEvidenceFact(factId);
    },

    evidenceFactOptionLabel(fact) {
      const raw = typeof fact?.description === 'string' ? fact.description.replace(/\s+/g, ' ').trim() : '';
      if (!raw) return fact.id;
      return `${fact.id} · ${raw.length > 44 ? `${raw.slice(0, 44)}…` : raw}`;
    },

    errorText(error) {
      return error && error.message ? error.message : String(error);
    },

    runOutcomeLabel(run) {
      const labels = {
        success: '成功',
        failed: '失败',
        rejected: '拒绝',
        cancelled: '已取消',
        unhealthy: '不健康',
        inactive: '未激活',
        running: '运行中',
      };
      const outcome = run?.outcome || 'running';
      return labels[outcome] || outcome;
    },

    runOutcomeClass(run) {
      const outcome = run?.outcome;
      if (outcome === 'success') return 'border-teal-200 bg-teal-50 text-teal-700';
      if (outcome === 'failed' || outcome === 'rejected') return 'border-rose-200 bg-rose-50 text-rose-600';
      if (outcome === 'unhealthy') return 'border-orange-200 bg-orange-50 text-orange-600';
      if (outcome === 'cancelled' || outcome === 'inactive') return 'border-slate-200 bg-slate-100 text-slate-500';
      return 'border-sky-200 bg-sky-50 text-sky-600';
    },

    runDurationLabel(run) {
      if (run?.duration_ms !== null && run?.duration_ms !== undefined) {
        return this.formatDurationMs(run.duration_ms);
      }
      return run?.finished_at ? '—' : '运行中';
    },

    runExitLabel(run) {
      if (run?.exit_code !== null && run?.exit_code !== undefined) return String(run.exit_code);
      return run?.finished_at ? '—' : '等待中';
    },

    formatNumber(value) {
      const parsed = Number(value);
      return Number.isFinite(parsed) ? parsed.toLocaleString('zh-CN') : '0';
    },

    strategistBudgetText(used, limit) {
      const current = this.formatNumber(used);
      const cap = Number(limit);
      return cap > 0 ? `${current} / ${this.formatNumber(cap)}` : current;
    },

    strategistCostText(used, limit) {
      const current = `$${Number(used || 0).toFixed(4)}`;
      const cap = Number(limit);
      return cap > 0 ? `${current} / $${cap.toFixed(4)}` : current;
    },

    costFactRows() {
      const facts = this.costPanel.data && Array.isArray(this.costPanel.data.facts) ? this.costPanel.data.facts : [];
      return facts.filter((fact) => fact.run_id !== null || fact.total_tokens > 0);
    },

    costIntentRows() {
      const intents = this.costPanel.data && Array.isArray(this.costPanel.data.intents) ? this.costPanel.data.intents : [];
      return intents.filter((intent) =>
        intent.total_tokens > 0 ||
        intent.origin_run_id !== null ||
        (intent.produced_fact_ids || []).length > 0
      );
    },

    causalEdgeLabel(kind) {
      const labels = {
        created_intent: '创建意图',
        executed_by: '执行意图',
        produced_fact: '产出事实',
        source_fact: '来源事实',
        concluded_fact: '结论事实',
      };
      return labels[kind] || kind;
    },

    strategistIntentBudget(intent) {
      const budget = intent?.budget;
      if (!budget) return '默认';
      const parts = [];
      if (budget.max_seconds) parts.push(`${budget.max_seconds} 秒`);
      if (budget.max_tool_calls) parts.push(`${budget.max_tool_calls} 次工具`);
      return parts.length > 0 ? parts.join(' · ') : '默认';
    },

    strategistPriorityClass(priority) {
      if (priority >= 80) return 'border-rose-200 bg-rose-50 text-rose-600';
      if (priority >= 50) return 'border-amber-200 bg-amber-50 text-amber-600';
      return 'border-slate-200 bg-white text-slate-500';
    },

    strategistExhaustedFlags(budget) {
      if (!budget || !budget.exhausted) return [];
      const flags = [];
      if (budget.exhausted.tokens) flags.push('Token 用尽');
      if (budget.exhausted.cost_usd) flags.push('成本用尽');
      if (budget.exhausted.tasks) flags.push('并发已满');
      return flags;
    },

    strategistExhaustedLabel(budget) {
      const flags = this.strategistExhaustedFlags(budget);
      return flags.length > 0 ? flags.join(' · ') : '正常';
    },

    strategistExhaustedClass(budget) {
      return this.strategistExhaustedFlags(budget).length > 0
        ? 'border-rose-200 bg-rose-50 text-rose-600'
        : 'border-teal-200 bg-teal-50 text-teal-700';
    },

    proposalSummary(proposal) {
      const payload = proposal?.payload || {};
      if (proposal?.kind === 'hint') return payload.content || '(空提示)';
      return payload.description || '(空描述)';
    },

    proposalKindLabel(kind) {
      const labels = { fact: '事实', intent: '意图', hint: '提示' };
      return labels[kind] || kind;
    },

    proposalKindClass(kind) {
      if (kind === 'fact') return 'bg-brand-50 text-brand-700';
      if (kind === 'intent') return 'bg-amber-50 text-amber-700';
      if (kind === 'hint') return 'bg-teal-50 text-teal-700';
      return 'bg-slate-100 text-slate-500';
    },

    proposalStatusLabel(status) {
      const labels = {
        pending: '待审核',
        applied: '已写入',
        rejected: '已拒绝',
        duplicate: '重复',
        dry_run: '仅演练',
      };
      return labels[status] || status;
    },

    proposalStatusClass(status) {
      if (status === 'applied') return 'border-teal-200 bg-teal-50 text-teal-700';
      if (status === 'rejected') return 'border-rose-200 bg-rose-50 text-rose-600';
      if (status === 'duplicate') return 'border-slate-200 bg-slate-100 text-slate-500';
      if (status === 'dry_run') return 'border-amber-200 bg-amber-50 text-amber-600';
      return 'border-sky-200 bg-sky-50 text-sky-600';
    },

    proposalSourceLabel(source) {
      const labels = { observer: '观察者', strategist: '策略器', human: '人工' };
      return labels[source] || source;
    },

    auditDecisionLabel(event) {
      const decision = event && typeof event === 'object' && typeof event.decision === 'string'
        ? event.decision
        : 'unknown';
      const labels = { allow: '允许', block: '阻止', unknown: '未知' };
      return labels[decision] || decision;
    },

    auditDecisionClass(event) {
      const decision = event && typeof event === 'object' ? event.decision : null;
      if (decision === 'allow') return 'border-teal-200 bg-teal-50 text-teal-700';
      if (decision === 'block') return 'border-rose-200 bg-rose-50 text-rose-600';
      return 'border-slate-200 bg-slate-100 text-slate-500';
    },

    auditEventTool(event) {
      if (!event || typeof event !== 'object') return typeof event === 'string' ? event : '事件';
      return typeof event.tool === 'string' ? event.tool : '事件';
    },

    auditEventAction(event) {
      if (!event || typeof event !== 'object' || event.action === null || event.action === undefined) return '';
      return Array.isArray(event.action) ? event.action.join(', ') : String(event.action);
    },

    auditEventTimestamp(row) {
      const event = row?.event;
      if (event && typeof event === 'object' && typeof event.ts === 'string') return event.ts;
      return row?.created_at || '';
    },

    auditTargetsLabel(event) {
      if (!event || typeof event !== 'object') return '';
      const targets = event.targets;
      if (Array.isArray(targets)) {
        return targets.map(target => typeof target === 'string' ? target : JSON.stringify(target)).join(', ');
      }
      return typeof targets === 'string' ? targets : '';
    },

    auditEventReason(event) {
      if (!event || typeof event !== 'object' || typeof event.reason !== 'string') return '';
      return event.reason;
    },

    auditEventDetail(event) {
      if (!event || typeof event !== 'object' || typeof event.detail !== 'string') return '';
      return event.detail;
    },

    factEvidenceStatusLabel(status) {
      const labels = { provided: '已提供', missing: '缺失', legacy: '历史数据' };
      return labels[status] || String(status || '未知');
    },

    factEvidenceStatusClass(status) {
      if (status === 'provided') return 'border-teal-200 bg-teal-50 text-teal-700';
      if (status === 'missing') return 'border-rose-200 bg-rose-50 text-rose-600';
      return 'border-slate-200 bg-slate-100 text-slate-500';
    },

    evidenceFileStatusLabel(status) {
      const labels = {
        ok: '正常',
        modified: '已修改',
        missing: '缺失',
        unreadable: '不可读',
        invalid: '无效',
        unverified: '未验证',
      };
      return labels[status] || status || '未知';
    },

    evidenceFileStatusClass(status) {
      if (status === 'ok') return 'border-teal-200 bg-teal-50 text-teal-700';
      if (status === 'modified') return 'border-amber-200 bg-amber-50 text-amber-700';
      if (status === 'missing' || status === 'unreadable' || status === 'invalid') {
        return 'border-rose-200 bg-rose-50 text-rose-600';
      }
      return 'border-slate-200 bg-slate-100 text-slate-500';
    },

    evidenceFileStatusTextClass(status) {
      if (status === 'ok') return 'text-teal-600';
      if (status === 'modified') return 'text-amber-600';
      if (status === 'missing' || status === 'unreadable' || status === 'invalid') return 'text-rose-500';
      return 'text-slate-400';
    },

    evidenceFileStatusHint(status) {
      const hints = {
        ok: '文件的大小与摘要仍与记录一致。',
        modified: '文件在该事实记录后发生了修改。',
        missing: '记录的文件已不在工作区中。',
        unreadable: '文件存在，但无法读取。',
        invalid: '记录路径无效，或超出了项目工作区。',
        unverified: '未配置工作区根目录，因此只显示已存储的元数据。',
      };
      return hints[status] || '无法获取校验状态。';
    },

    shortHash(hash, keep = 10) {
      if (typeof hash !== 'string' || hash.length === 0) return '—';
      if (hash.length <= keep + 9) return hash;
      return `${hash.slice(0, keep)}…${hash.slice(-8)}`;
    },

    prettyJson(value) {
      try {
        const text = JSON.stringify(value, null, 2);
        return text === undefined ? String(value) : text;
      } catch {
        return String(value);
      }
    },

    formatBytes(bytes) {
      if (bytes === null || bytes === undefined || !Number.isFinite(bytes)) return '—';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KiB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MiB`;
    },

    async toggleProjectStop() {
      if (!this.selectedProjectId || !this.project || this.project.project.status === 'completed') return;
      const nextStatus = this.project.project.status === 'active' ? 'stopped' : 'active';
      try {
        await this.setProjectStatus(this.selectedProjectId, nextStatus);
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    async toggleProjectStopById(projectId, currentStatus) {
      if (!projectId || currentStatus === 'completed') return;
      const nextStatus = currentStatus === 'active' ? 'stopped' : 'active';
      try {
        await this.setProjectStatus(projectId, nextStatus);
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    async setProjectStatus(projectId, status, options = {}) {
      const { reload = true, toast = true } = options;
      const updated = await this.api('PUT', `/projects/${projectId}/status`, { status });
      const projectSummary = this.projects.find(item => item.id === projectId);
      if (projectSummary) {
        projectSummary.status = updated.status;
        projectSummary.reason = updated.reason;
      }
      if (this.selectedProjectId === projectId && this.project) {
        this.project.project.status = updated.status;
        this.project.project.reason = updated.reason;
        if (!this.projectIsActive()) {
          this.showIntentModal = false;
          this.showConcludeModal = false;
          this.showCompleteModal = false;
        }
        if (!this.projectCanWriteHints()) {
          this.showHintModal = false;
        }
      }
      if (reload) await this.loadProjects();
      if (toast) this.showToast(status === 'stopped' ? '项目已停止' : '项目已恢复');
      return updated;
    },

    async stopAllActiveProjects() {
      const activeProjects = this.projects.filter(project => project.status === 'active');
      if (activeProjects.length === 0 || this.isStoppingAllProjects) return;
      this.isStoppingAllProjects = true;
      try {
        const results = await Promise.allSettled(
          activeProjects.map(project => this.setProjectStatus(project.id, 'stopped', { reload: false, toast: false }))
        );
        await this.loadProjects();
        const successCount = results.filter(result => result.status === 'fulfilled').length;
        const failureCount = results.length - successCount;
        if (failureCount === 0) {
          this.showToast(`已停止 ${successCount} 个进行中的项目`);
        } else {
          this.showToast(`已停止 ${successCount} 个项目，${failureCount} 个失败`, 'error');
        }
      } catch (e) {
        this.showToast(e.message, 'error');
      } finally {
        this.isStoppingAllProjects = false;
      }
    },

    openReopenProject(projectId, projectTitle = '') {
      if (!projectId) return;
      this.reopenForm = { projectId, projectTitle, description: '' };
      this.showReopenModal = true;
    },

    openRenameProject(projectId, projectTitle = '') {
      if (!projectId) return;
      this.renameForm = { projectId, originalTitle: projectTitle, title: projectTitle };
      this.showRenameModal = true;
      this.$nextTick(() => {
        this.$refs.renameTitleInput?.focus();
        this.$refs.renameTitleInput?.select?.();
      });
    },

    async renameProject() {
      const projectId = this.renameForm.projectId || this.selectedProjectId;
      if (!projectId) return;
      try {
        const updated = await this.api('PUT', `/projects/${projectId}/title`, {
          title: this.renameForm.title,
        });
        const projectSummary = this.projects.find(item => item.id === projectId);
        if (projectSummary) {
          projectSummary.title = updated.title;
        }
        if (this.selectedProjectId === projectId && this.project) {
          this.project.project.title = updated.title;
        }
        this.showRenameModal = false;
        this.renameForm = { projectId: '', originalTitle: '', title: '' };
        await this.loadProjects();
        this.showToast('项目已重命名');
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    replayProgressLabel() {
      if (!this.replay.active || this.replay.frames.length === 0) return '回放';
      return `回放 ${Math.min(this.replay.frameIndex + 1, this.replay.frames.length)} / ${this.replay.frames.length}`;
    },

    stopReplayTimer() {
      if (!this.replay.timer) return;
      clearTimeout(this.replay.timer);
      this.replay.timer = null;
    },

    updateReplaySpeed() {
      if (!this.replay.active || !this.replay.playing) return;
      this.stopReplayTimer();
      this.scheduleReplayTick();
    },

    replayEventWeight(event) {
      const type = event?.type;
      if (type === 'reason_started') return 1.6;
      if (type === 'intent_declared') return 1.05;
      if (type === 'intent_running') return 0.75;
      if (type === 'intent_concluded' || type === 'project_completed') return 1.6;
      if (type === 'project_created' || type === 'hint_added') return 0.8;
      return 1.0;
    },

    replayEventDurationMs(event) {
      const base = Number(this.replay.stepMs) || 1100;
      return Math.round(base * this.replayEventWeight(event));
    },

    replayTimelineElapsedDurationMs(events, index) {
      let elapsed = 0;
      for (let i = 0; i < index; i += 1) {
        elapsed += this.replayEventDurationMs(events[i]);
      }
      return elapsed;
    },

    scheduleReplayTick() {
      if (!this.replay.active || !this.replay.playing) return;
      if (this.replay.frameIndex >= this.replay.frames.length - 1) {
        this.replay.playing = false;
        return;
      }
      this.stopReplayTimer();
      const currentFrame = this.replay.frames[this.replay.frameIndex];
      const delay = this.replayEventDurationMs(currentFrame?.event);
      this.replay.timer = setTimeout(() => this.advanceProjectReplay(), delay);
    },

    buildInitialReplayProject(sourceProject) {
      const origin = sourceProject.facts.find(fact => fact.id === 'origin');
      const goal = sourceProject.facts.find(fact => fact.id === 'goal');
      return {
        project: {
          ...this.cloneData(sourceProject.project),
          status: 'active',
          reason: null,
        },
        facts: [origin, goal].filter(Boolean).map(fact => this.cloneData(fact)),
        intents: [],
        hints: [],
      };
    },

    buildReplayFrames(sourceProject, baseEvents) {
      const sourceIntents = new Map(sourceProject.intents.map(intent => [intent.id, intent]));
      const replayEvents = [];

      for (const event of baseEvents) {
        if (event.type !== 'intent_declared' || !event.intentId) {
          replayEvents.push(this.cloneData(event));
          continue;
        }

        const sourceIntent = sourceIntents.get(event.intentId);
        replayEvents.push({
          id: `reason-started-${event.intentId}`,
          type: 'reason_started',
          timestamp: sourceIntent?.created_at || event.timestamp,
          actor: sourceIntent?.creator || event.actor || '推理器',
          title: sourceIntent?.description || event.title,
          meta: [
            sourceIntent?.id || event.intentId,
            `来源：${(sourceIntent?.from || event.sourceFactIds || []).join(', ')}`,
          ],
          targetType: 'reason',
          targetId: sourceIntent?.id || event.intentId,
          order: `${event.order}.reason`,
          intentId: sourceIntent?.id || event.intentId,
          producedFactId: null,
          sourceFactIds: [...(sourceIntent?.from || event.sourceFactIds || [])],
        });
        replayEvents.push(this.cloneData(event));
        if (!sourceIntent?.worker) continue;
        replayEvents.push({
          id: `intent-running-${sourceIntent.id}`,
          type: 'intent_running',
          timestamp: sourceIntent.last_heartbeat_at || sourceIntent.created_at,
          actor: sourceIntent.worker,
          title: sourceIntent.description,
          meta: [sourceIntent.id, `执行器：${sourceIntent.worker}`],
          targetType: 'intent',
          targetId: sourceIntent.id,
          order: `${event.order}.run`,
          intentId: sourceIntent.id,
          producedFactId: null,
          sourceFactIds: [...sourceIntent.from],
        });
      }

      const replayProject = this.buildInitialReplayProject(sourceProject);
      const frames = [];
      for (const event of replayEvents) {
        this.applyReplayEvent(replayProject, sourceProject, event);
        frames.push({
          event: this.cloneData(event),
          project: this.cloneData(replayProject),
        });
      }

      if (frames.length > 0) {
        frames[frames.length - 1].project.project.status = sourceProject.project.status;
        frames[frames.length - 1].project.project.reason = this.cloneData(sourceProject.project.reason);
      }
      return frames;
    },

    applyReplayEvent(replayProject, sourceProject, event) {
      if (!replayProject || !sourceProject || !event) return;
      const sourceIntent = event.intentId
        ? sourceProject.intents.find(intent => intent.id === event.intentId) || null
        : null;

      if (event.type === 'project_created') {
        replayProject.project.title = sourceProject.project.title;
        replayProject.project.status = 'active';
        return;
      }

      if (event.type === 'hint_added') {
        const hint = sourceProject.hints.find(item => item.id === event.targetId);
        if (hint && !replayProject.hints.some(item => item.id === hint.id)) {
          replayProject.hints.push(this.cloneData(hint));
        }
        return;
      }

      if (event.type === 'reason_started') {
        replayProject.project.reason = {
          worker: event.actor || '推理器',
          trigger: 'new_facts',
          started_at: event.timestamp,
          last_heartbeat_at: event.timestamp,
        };
        return;
      }

      if (event.type === 'intent_declared') {
        if (!sourceIntent) return;
        replayProject.project.reason = null;
        if (!replayProject.intents.some(intent => intent.id === sourceIntent.id)) {
          replayProject.intents.push({
            id: sourceIntent.id,
            from: [...sourceIntent.from],
            to: null,
            description: sourceIntent.description,
            creator: sourceIntent.creator,
            worker: null,
            last_heartbeat_at: null,
            created_at: sourceIntent.created_at,
            concluded_at: null,
          });
        }
        return;
      }

      if (event.type === 'intent_running') {
        if (!sourceIntent) return;
        const replayIntent = replayProject.intents.find(intent => intent.id === sourceIntent.id);
        if (!replayIntent) return;
        replayIntent.worker = sourceIntent.worker || sourceIntent.creator;
        replayIntent.last_heartbeat_at = sourceIntent.last_heartbeat_at || sourceIntent.created_at;
        return;
      }

      if (event.type !== 'intent_concluded' && event.type !== 'project_completed') return;
      if (!sourceIntent) return;

      const replayIntent = replayProject.intents.find(intent => intent.id === sourceIntent.id);
      if (replayIntent) {
        replayIntent.to = sourceIntent.to;
        replayIntent.worker = sourceIntent.worker || sourceIntent.creator;
        replayIntent.last_heartbeat_at = sourceIntent.last_heartbeat_at;
        replayIntent.concluded_at = sourceIntent.concluded_at;
      }

      if (event.type === 'project_completed') {
        replayProject.project.status = 'completed';
        return;
      }

      const producedFact = sourceProject.facts.find(fact => fact.id === sourceIntent.to);
      if (producedFact && !replayProject.facts.some(fact => fact.id === producedFact.id)) {
        replayProject.facts.push(this.cloneData(producedFact));
      }
    },

    applyReplayFrame(frameIndex, options = {}) {
      if (!this.replay.active) return;
      const { reinitialize = false } = options;
      const frame = this.replay.frames[frameIndex];
      if (!frame) return;

      this.replay.frameIndex = frameIndex;
      this.project = this.cloneData(frame.project);
      this.replay.visibleEvents = this.replay.frames
        .slice(0, frameIndex + 1)
        .map(item => this.cloneData(item.event))
        .filter(entry => entry.type !== 'reason_started')
        .map((entry, index, list) => ({ ...entry, isLast: index === list.length - 1 }));
      this._timelineEventsCacheProject = null;
      this._timelineEventsCache = [];

      if (reinitialize) {
        this.teardownAutoFit();
        if (this.cy) {
          this.cy.destroy();
          this.cy = null;
        }
        this.$nextTick(() => {
          this.initGraph();
          this.followReplayTimelineTail();
        });
        return;
      }

      this.updateGraph();
      this.followReplayTimelineTail();
    },

    async startProjectReplay() {
      if (!this.project || this.replay.active || !this.selectedProjectId) return;
      try {
        const sourceProject = await this.api('GET', `/projects/${this.selectedProjectId}`);
        const baseEvents = this.timelineEvents().map(event => ({
          ...event,
          meta: [...(event.meta || [])],
          sourceFactIds: [...(event.sourceFactIds || [])],
        }));
        const frames = this.buildReplayFrames(sourceProject, baseEvents);
        if (frames.length === 0) {
          this.showToast('没有可回放的时间线', 'error');
          return;
        }

        const stepMs = String(this.replay.stepMs || '1100');
        this.stopReplayTimer();
        this.replay = {
          active: true,
          playing: true,
          stepMs,
          frameIndex: -1,
          frames,
          visibleEvents: [],
          sourceProject,
          timer: null,
        };
        this.polling = false;
        this.sideTab = 'log';
        this.selectedNode = null;
        this.selectedFacts = [];
        this.selectedTimelineEntryId = null;
        this.applyReplayFrame(0, { reinitialize: true });
        this.scheduleReplayTick();
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    advanceProjectReplay() {
      if (!this.replay.active) return;
      if (this.replay.frameIndex >= this.replay.frames.length - 1) {
        this.replay.playing = false;
        this.stopReplayTimer();
        return;
      }
      this.applyReplayFrame(this.replay.frameIndex + 1);
      this.scheduleReplayTick();
    },

    toggleProjectReplayPlayback() {
      if (!this.replay.active) return;
      if (this.replay.playing) {
        this.replay.playing = false;
        this.stopReplayTimer();
        return;
      }
      if (this.replay.frameIndex >= this.replay.frames.length - 1) {
        this.restartProjectReplay();
        return;
      }
      this.replay.playing = true;
      this.scheduleReplayTick();
    },

    restartProjectReplay() {
      if (!this.replay.active || this.replay.frames.length === 0) return;
      this.stopReplayTimer();
      this.replay.playing = true;
      this.selectedNode = null;
      this.selectedFacts = [];
      this.selectedTimelineEntryId = null;
      this.applyReplayFrame(0, { reinitialize: true });
      this.scheduleReplayTick();
    },

    async exitProjectReplay() {
      if (!this.replay.active) return;
      const projectId = this.selectedProjectId;
      const stepMs = String(this.replay.stepMs || '1100');
      this.stopReplayTimer();
      this.replay = {
        active: false,
        playing: false,
        stepMs,
        frameIndex: -1,
        frames: [],
        visibleEvents: [],
        sourceProject: null,
        timer: null,
      };
      this._timelineEventsCacheProject = null;
      this._timelineEventsCache = [];
      this.polling = true;
      if (!projectId) return;
      await this.loadProject(projectId);
      this.$nextTick(() => {
        this.teardownAutoFit();
        if (this.cy) {
          this.cy.destroy();
          this.cy = null;
        }
        this.initGraph();
      });
    },

    async reopenProject() {
      const projectId = this.reopenForm.projectId || this.selectedProjectId;
      if (!projectId) return;
      try {
        const actor = this.actorName();
        await this.api('POST', `/projects/${projectId}/reopen`, {
          description: this.reopenForm.description,
          creator: actor,
        });
        this.showReopenModal = false;
        this.reopenForm = { projectId: '', projectTitle: '', description: '' };
        await this.loadProjects();
        if (this.selectedProjectId === projectId && this.view === 'graph') {
          await this.loadProject(projectId);
          this.updateGraph();
        }
        this.showToast('项目已重新打开');
      } catch (e) {
        this.showToast(e.message, 'error');
      }
    },

    async openProject(id) {
      if (this.replay.active) {
        this.stopReplayTimer();
        this.replay.active = false;
        this.replay.playing = false;
        this.replay.frames = [];
        this.replay.visibleEvents = [];
        this.replay.frameIndex = -1;
        this.replay.sourceProject = null;
        this._timelineEventsCacheProject = null;
        this._timelineEventsCache = [];
        this.polling = true;
      }
      this.rememberProjectListScroll();
      this.selectedProjectId = id;
      this.selectedNode = null;
      this.selectedFacts = [];
      this.selectedTimelineEntryId = null;
      this.resetOpsPanels();
      await this.loadProject(id);
      this.view = 'graph';
      if (['runs', 'strategist', 'audit', 'evidence', 'cost'].includes(this.sideTab)) this.loadActiveOpsTab();
      if (location.hash !== `#/projects/${id}`) location.hash = `/projects/${id}`;
      this.$nextTick(() => {
        const clampedWidth = this.clampPanelWidth(this.sidePanelWidth);
        if (clampedWidth !== this.sidePanelWidth) {
          this.sidePanelWidth = clampedWidth;
          this.saveSidePanelWidth();
        }
        this.teardownAutoFit();
        if (this.cy) { this.cy.destroy(); this.cy = null; }
        this.initGraph();
      });
    },

    backToList(fromRoute) {
      if (this.replay.active) {
        this.stopReplayTimer();
        this.replay.active = false;
        this.replay.playing = false;
        this.replay.frames = [];
        this.replay.visibleEvents = [];
        this.replay.frameIndex = -1;
        this.replay.sourceProject = null;
        this._timelineEventsCacheProject = null;
        this._timelineEventsCache = [];
        this.polling = true;
      }
      this.view = 'list';
      this.shouldRestoreProjectListScroll = true;
      this.project = null;
      this.selectedProjectId = '';
      this.selectedNode = null;
      this.selectedFacts = [];
      this.selectedTimelineEntryId = null;
      this.resetOpsPanels();
      this.teardownAutoFit();
      if (this.cy) { this.cy.destroy(); this.cy = null; }
      if (!fromRoute) location.hash = '/';
      this.loadProjects().then(() => this.restoreProjectListScroll());
    },

    startPolling() {
      this.pollTimer = setInterval(async () => {
        if (!this.polling) return;
        if (this.selectedProjectId && this.view === 'graph') {
          await this.loadProject(this.selectedProjectId);
          this.updateGraph();
        } else {
          await this.loadProjects();
        }
      }, 5000);
    },

    buildElements() {
      const nodes = [];
      const edges = [];
      for (const f of this.project.facts) {
        const nodeType = f.id === 'origin' ? 'origin' : f.id === 'goal' ? 'goal' : 'fact';
        const label = this.summarizeFactLabel(f);
        const size = this.factNodeSize(label, nodeType);
        nodes.push({ data: {
          id: f.id,
          label,
          description: f.description,
          nodeType,
          width: size.width,
          height: size.height,
        }});
      }
      for (const intent of this.project.intents) {
        const lbl = intent.description;
        if (intent.to) {
          for (const src of intent.from) {
            edges.push({ data: { id: `${intent.id}_${src}`, source: src, target: intent.to, intentId: intent.id, label: lbl, status: 'concluded' }});
          }
        } else {
          const phId = `_ph_${intent.id}`;
          const nodeSize = this.openIntentNodeSize(intent);
          const nodeType = this.openIntentNodeType(intent);
          nodes.push({ data: {
            id: phId,
            label: this.openIntentNodeLabel(intent),
            description: intent.description,
            nodeType,
            intentId: intent.id,
            width: nodeSize.width,
            height: nodeSize.height,
          }});
          for (const src of intent.from) {
            edges.push({ data: { id: `${intent.id}_${src}`, source: src, target: phId, intentId: intent.id, label: lbl, status: nodeType }});
          }
          if (this.isBootstrapIntent(intent)) {
            edges.push({ data: { id: `${intent.id}_goal`, source: phId, target: 'goal', intentId: intent.id, label: '', status: nodeType, edgeType: 'bootstrap_scope' }});
          }
        }
      }
      return { nodes, edges };
    },

    initGraph() {
      const container = document.getElementById('cy');
      if (!container) return;
      const { nodes, edges } = this.buildElements();
      const rawCy = cytoscape({
        container,
        elements: [...nodes, ...edges],
        style: this.graphStyles(),
        layout: this.layoutOpts(),
        minZoom: 0.15, maxZoom: 3.5,
      });
      this.cy = rawCy;
      const self = this;
      rawCy.on('tap', 'node', e => self.onNodeTap(e));
      rawCy.on('tap', 'edge', e => self.onEdgeTap(e));
      rawCy.on('tap', e => { if (e.target === rawCy) self.clearSelection(); });
      this.pulseActive();
      this.setupAutoFit();
    },

          fit: true,
          padding: 50,

            'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
